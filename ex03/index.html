<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Colors & Opacity</h1>

    <div class="palette">
        <div class="color named">Named Color</div>
        <div class="color hex">HEX Color</div>
        <div class="color rgb">RGB Color</div>
        <div class="color rgba">RGBA Color</div>
    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">

        <div class="box opacity-box">
            <p>Opacity 0.5</p>
        </div>

        <div class="box rgba-box">
            <p>RGBA 0.5</p>
        </div>

    </div>

</body>

</html>
